[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backfill-pipeline"
version = "0.3.0"
description = "Idempotent, resumable backfills for partitioned tables"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sana Iyer" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
]

[project.scripts]
backfill-pipeline = "backfill_pipeline.cli:main"

[tool.setuptools]
packages = ["backfill_pipeline"]
